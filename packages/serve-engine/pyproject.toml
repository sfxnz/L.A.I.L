[project]
name = "lail-serve-engine"
version = "0.2.0"
description = "L.A.I.L serve-engine — vLLM serve, perf, agentic (ported from Local AI Lab)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "aiosqlite>=0.20.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.0.0",
]

[project.scripts]
lail-serve-engine = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
